name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-armeabi-v7a-release.apk     wifi-scanner-arm32.apk     || true
          mv app-arm64-v8a-release.apk       wifi-scanner-arm64.apk     || true
          mv app-x86_64-release.apk          wifi-scanner-x64.apk       || true
          mv app-release.apk                 wifi-scanner-universal.apk
          ls -lh *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-scanner-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
